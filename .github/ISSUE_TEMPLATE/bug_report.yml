name: Bug report
description: Report a reproducible incorrect result or failure
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Minimal repository layout
      description: Remove secrets and private code. A small synthetic fixture is ideal.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentGuide Lint version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js and operating system
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: shell
